<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Alert | Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Inter:wght@400;500;600;700;900&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B1215;
            /* Subtle dot pattern for that industrial terminal feel */
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .font-mono {
            font-family: 'DM Mono', monospace;
        }

        .font-syne {
            font-family: 'Syne', sans-serif;
        }

        .custom-card {
            background: rgba(17, 25, 31, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
        }

        /* Sleek input styling */
        input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center relative overflow-hidden">

    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-emerald-500/10 blur-[120px] rounded-full pointer-events-none">
    </div>

    <div class="custom-card w-full max-w-md p-10 rounded-3xl relative z-10 shadow-2xl mx-4">

        <div class="text-center mb-10">
            <div
                class="w-16 h-16 bg-emerald-500 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(16,185,129,0.3)]">
                <svg class="w-8 h-8 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold tracking-tighter uppercase text-white font-syne">Farmer<span
                    class="text-emerald-500">Alert</span></h1>
            <p class="text-[10px] text-slate-500 font-bold tracking-[0.3em] uppercase mt-2">Mission Control Access</p>
        </div>

        <form id="login-form" class="space-y-6">

            <div id="error-message"
                class="hidden bg-red-500/10 border border-red-500/20 text-red-500 text-xs font-bold px-4 py-3 rounded text-center tracking-wide">
                Invalid email or password.
            </div>

            <div class="space-y-1">
                <label class="text-[10px] text-slate-400 font-black uppercase tracking-widest pl-1">Email
                    Address</label>
                <input type="email" id="email" required placeholder="manager@farm.com"
                    class="w-full bg-black/40 border border-white/10 text-white px-4 py-3 rounded-xl font-mono text-sm transition-all placeholder:text-slate-600">
            </div>

            <div class="space-y-1">
                <div class="flex justify-between items-baseline px-1">
                    <label class="text-[10px] text-slate-400 font-black uppercase tracking-widest">Authorization
                        Key</label>
                    <a href="#"
                        class="text-[10px] text-emerald-500 hover:text-emerald-400 font-bold uppercase tracking-wider transition-colors">Reset</a>
                </div>
                <input type="password" id="password" required placeholder="••••••••"
                    class="w-full bg-black/40 border border-white/10 text-white px-4 py-3 rounded-xl font-mono text-sm transition-all placeholder:text-slate-600">
            </div>

            <button type="submit" id="submit-btn"
                class="w-full bg-emerald-500 text-black font-black uppercase tracking-widest py-4 rounded-xl hover:bg-emerald-400 transition-all shadow-[0_0_20px_rgba(16,185,129,0.2)] hover:shadow-[0_0_30px_rgba(16,185,129,0.4)] flex justify-center items-center gap-2 mt-4">
                <span>Initiate Uplink</span>
                <svg id="btn-spinner" class="animate-spin h-4 w-4 text-black hidden" xmlns="http://www.w3.org/2000/svg"
                    fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/5 pt-6">
            <p class="text-xs text-slate-500 font-medium">Enterprise Intelligence v1.0 <br> Secure 256-bit Encryption
            </p>
        </div>
    </div>

    <script>
        // Make sure this matches your actual Render URL
        const BASE_URL = "https://farmer-alert-api.onrender.com/api";

        // Redirect if already logged in
        if (localStorage.getItem('farm_token')) {
            window.location.href = 'index.html';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-message');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = submitBtn.querySelector('span');
            const btnSpinner = document.getElementById('btn-spinner');

            // Reset UI
            errorBox.classList.add('hidden');
            btnText.innerText = 'AUTHENTICATING...';
            btnSpinner.classList.remove('hidden');
            submitBtn.disabled = true;

            try {
                // REQUIRED BY FASTAPI OAUTH2: We must send data as URLSearchParams, NOT JSON.
                // We also MUST map our "email" to the field name "username".
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);

                const response = await fetch(`${BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Invalid credentials');
                }

                const data = await response.json();

                // Save the JWT token securely to local storage
                localStorage.setItem('farm_token', data.access_token);

                // Success! Flash green and redirect
                btnText.innerText = 'ACCESS GRANTED';
                btnSpinner.classList.add('hidden');
                submitBtn.classList.replace('bg-emerald-500', 'bg-white');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);

            } catch (error) {
                // Handle Failure
                errorBox.classList.remove('hidden');
                btnText.innerText = 'INITIATE UPLINK';
                btnSpinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
