<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Alert | Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Inter:wght@400;500;600;700;900&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B1215;
        }



        .font-mono {
            font-family: 'DM Mono', monospace;
        }

        .custom-card {
            background: rgba(17, 25, 31, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* The Hero Number: Dominant and Upright */
        #farm-avg {
            font-size: 9rem;
            line-height: 1;
            letter-spacing: -0.05em;
        }

        @media (max-width: 640px) {
            #farm-avg {
                font-size: 6rem;
            }
        }
    </style>
</head>

<body class="text-slate-100 min-h-screen">

    <nav
        class="border-b border-white/5 bg-[#0B1215]/80 backdrop-blur-md px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div
                class="w-8 h-8 bg-emerald-500 rounded flex items-center justify-center shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                <svg class="w-5 h-5 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tighter uppercase text-white">Farmer<span
                        class="text-emerald-500">Alert</span></h1>
                <p class="text-[9px] text-slate-500 font-bold tracking-[0.3em] uppercase">Enterprise Intelligence v1.0
                </p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="logout()"
                class="text-xs font-bold text-slate-500 hover:text-red-400 transition">LOGOUT</button>
            <button onclick="fetchAllData()"
                class="bg-white/5 border border-white/10 text-white px-5 py-2 rounded font-bold text-xs hover:bg-white/10 transition flex items-center gap-2">
                REFRESH
            </button>
        </div>
    </nav>

    <main class="max-w-[1400px] mx-auto p-6 space-y-6">

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div
                class="lg:col-span-3 custom-card rounded-3xl p-8 flex flex-col justify-between h-[450px] relative overflow-hidden">
                <div id="hero-accent" class="absolute top-0 left-0 w-full h-1.5 bg-slate-700"></div>
                <div>
                    <h2 class="text-slate-500 text-[10px] font-black uppercase tracking-[0.4em] mb-1">Farm
                        Average</h2>
                    <p class="text-[10px] text-slate-600 font-bold uppercase">Threshold: 20%</p>
                </div>

                <div class="py-4 text-center">
                    <span id="farm-avg" class="font-mono font-black text-white tracking-tighter">--</span>
                    <span class="text-3xl font-bold text-slate-700 ml-1 font-mono">%</span>
                </div>

                <div id="hero-badge-container" class="flex justify-center">
                    <span id="hero-status-badge"
                        class="px-3 py-1 bg-slate-800 text-slate-400 text-[10px] font-black rounded-full uppercase tracking-widest">Syncing...</span>
                </div>
            </div>

            <div class="lg:col-span-9 custom-card rounded-3xl p-8 flex flex-col h-[450px]">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="font-bold text-sm text-slate-300 uppercase tracking-widest">Moisture Trends
                        </h3>
                        <p id="chart-date-label" class="text-xs font-bold text-emerald-500 mt-1 uppercase">
                            Today</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] text-slate-500 font-black uppercase tracking-widest mb-1">Daily
                            Avg</p>
                        <p id="chart-daily-avg" class="text-2xl font-black font-mono text-white">--%</p>
                    </div>
                </div>

                <div class="relative flex-grow h-full">
                    <button id="btn-prev-day"
                        class="absolute left-2 top-[45%] -translate-y-1/2 z-10 bg-white/5 hover:bg-white/10 p-3 rounded-xl text-slate-400 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7">
                            </path>
                        </svg>
                    </button>
                    <div class="w-full h-full px-4">
                        <canvas id="mainChart"></canvas>
                    </div>
                    <button id="btn-next-day"
                        class="absolute right-2 top-[45%] -translate-y-1/2 z-10 bg-white/5 hover:bg-white/10 p-3 rounded-xl text-slate-400 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="space-y-4 pt-4">
            <h3 class="font-black text-white text-lg tracking-tight uppercase ml-2">Field Intelligence
            </h3>
            <div id="sensor-widgets-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
        </div>
    </main>

    <div id="sensorModal"
        class="fixed inset-0 bg-black/90 hidden z-[60] flex items-center justify-center backdrop-blur-xl transition-all">
        <div class="bg-[#0B1215] border border-white/10 rounded-[2.5rem] w-full max-w-4xl p-10 m-4 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-slate-500 hover:text-white transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
            <div class="flex justify-between items-end mb-8 border-b border-white/5 pb-8">
                <div>
                    <h2 id="modalTitle" class="text-4xl font-bold text-white tracking-tighter uppercase">Sensor Name
                    </h2>
                    <p id="modalSubtitle"
                        class="text-[10px] font-mono font-bold text-slate-500 tracking-[0.3em] uppercase mt-1">DEVICE_ID
                    </p>
                </div>
                <div class="text-right">
                    <p id="modal-date-label"
                        class="text-xs font-bold text-emerald-500 uppercase tracking-widest mb-1">Today</p>
                    <p id="modal-daily-avg" class="text-5xl font-mono font-black text-white tracking-tighter">--%</p>
                </div>
            </div>

            <div class="relative w-full" style="height: 350px;">
                <button id="btn-modal-prev"
                    class="absolute left-2 top-[45%] -translate-y-1/2 z-10 bg-white/5 p-3 rounded-xl text-slate-400 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7">
                        </path>
                    </svg>
                </button>

                <canvas id="modalChart"></canvas>

                <button id="btn-modal-next"
                    class="absolute right-2 top-[45%] -translate-y-1/2 z-10 bg-white/5 p-3 rounded-xl text-slate-400 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
